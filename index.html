<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>給你的禮物</title>
<meta name="description" content="有人在你桌上放了一個盒子">
<meta property="og:type" content="website">
<meta property="og:title" content="有人送你一個盒子">
<meta property="og:description" content="打開看看">
<meta name="theme-color" content="#dcdcd6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&text=%E6%8F%90%E8%B2%A8%E5%88%B8%E8%AA%AA%E5%88%B0%E5%81%9A&display=swap">
<style>
/* Layout: one fixed phone-height scene, an oak desk by a window. The wrapped box is the only bright object; the page chrome stays quiet around it. Every step happens in place, then the calendar and the ticket take the same desk. */
:root{
  --wall:#d8d9d4; --wall-top:#e3e3de;
  --desk:#c6a27a;
  --ink:#1f1b16; --ink-2:#5e554a; --ink-3:#7b7266;
  --hair:rgba(31,27,22,.08);
  --surface:#fdfbf7; --paper:#fcfbf7; --card:#f3eee4;
  --seal:#b8382b; --pen:#22325c;
  --ribbon:#f4efe4; --ribbon-d:#d3c8b4;
  --stand:#86b2db; --stand-l:#acc9e8; --stand-d:#5d8bb8; --wrap:#86b0d8;
  --sunc:#fff6e4; --sun:0;
  --ease:cubic-bezier(.22,1,.36,1);
  --f-hand:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --f-num:"Jost","Futura","Avenir Next","Helvetica Neue",sans-serif;
  --f-ui:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--wall);overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;font:15px/1.5 var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
[hidden]{display:none!important}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

#app{position:fixed;inset:0;overflow:hidden;touch-action:none}

/* ---------- room ---------- */
.room{position:absolute;inset:0;pointer-events:none}
.wall{position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,var(--wall-top),var(--wall))}
.desk{position:absolute;left:0;right:0;top:48%;bottom:0;background:
  linear-gradient(180deg,rgba(60,38,18,.34),rgba(60,38,18,0) 2%),
  linear-gradient(180deg,rgba(255,236,210,.08),rgba(40,24,10,.2)),
  repeating-linear-gradient(179deg,rgba(110,70,35,.07) 0 1px,transparent 1px 6px),
  repeating-linear-gradient(181.2deg,rgba(255,235,205,.09) 0 2px,transparent 2px 24px),
  repeating-linear-gradient(178.4deg,rgba(90,55,25,.06) 0 3px,transparent 3px 40px),
  var(--desk)}
.desk::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,245,230,.6)}
.sun{position:absolute;inset:0;transition:opacity 1.4s var(--ease)}
.sun i{display:block;background:var(--sunc);border-radius:4px}
.sun-wall{position:absolute;top:8%;left:calc(50% - var(--sun) * 36%);width:36%;height:27%;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:9% 7%;transform:skewY(-9deg);filter:blur(6px);opacity:calc(.8 - var(--sun) * .3)}
.sun-desk{position:absolute;top:74%;left:calc(2% - var(--sun) * 10%);width:58%;height:15%;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:12% 6%;transform:skewX(-42deg);filter:blur(7px);opacity:calc(.5 - var(--sun) * .2);mix-blend-mode:screen}
.dusk{position:absolute;inset:0;background:linear-gradient(180deg,rgba(38,36,58,.44),rgba(38,30,40,.32));opacity:0;transition:opacity 1.8s var(--ease)}
.hush{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 56%,rgba(28,24,30,.2),rgba(28,24,30,.62));opacity:0;transition:opacity 1.8s ease}
#app.reveal .hush{opacity:1;transition-duration:.7s}
.lamp{position:absolute;inset:0;background:radial-gradient(110% 65% at 82% 2%,rgba(255,204,140,.6),rgba(255,204,140,0) 62%);opacity:0;transition:opacity 2s var(--ease) .3s;mix-blend-mode:screen}
.vignette{position:absolute;inset:0;background:radial-gradient(130% 95% at 50% 44%,rgba(0,0,0,0) 56%,rgba(30,22,14,.24))}
#app.evening .dusk,#app.evening .lamp{opacity:1}
#app.evening .sun{opacity:0}

/* ---------- quiet chrome ---------- */
.sound{position:absolute;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.05);color:var(--ink-2);transition:background .15s var(--ease)}
.sound:active{transform:scale(.97)}
.sound .off{display:none}.sound.muted .on{display:none}.sound.muted .off{display:block}

.intro{position:absolute;z-index:20;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10vh);padding:0 max(24px,env(safe-area-inset-left,0px));text-align:center;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.kicker{margin:0 0 12px;font:400 13px/20px var(--f-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.intro h1{margin:0;font:400 clamp(26px,7.4vw,32px)/1.45 var(--f-hand);text-wrap:balance}
.cta{position:absolute;z-index:20;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 48px);display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity .5s var(--ease)}
.btn-start{height:48px;padding:0 32px;border-radius:10px;background:var(--ink);color:var(--surface);font:500 16px/48px var(--f-ui);letter-spacing:.12em;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.12);transition:transform .15s var(--ease)}
.btn-start:active{transform:scale(.97)}
.cta-note{margin:0;display:flex;align-items:center;gap:8px;font:400 13px/20px var(--f-ui);color:var(--ink-2)}
.cta-note .ico{width:16px;height:16px}
.link{font:400 13px/20px var(--f-ui);color:var(--ink-2);text-decoration:underline;text-underline-offset:4px;padding:4px 8px}
#app.started .intro{opacity:0;transform:translateY(-8px);pointer-events:none}
#app.started .cta{opacity:0;pointer-events:none}

.caption{position:absolute;z-index:20;left:0;right:0;top:var(--capY,30%);margin:0;padding:0 28px;text-align:center;font:400 clamp(20px,5.8vw,24px)/1.45 var(--f-hand);opacity:0;transform:translateY(6px);transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none;text-wrap:balance}
.caption.show{opacity:1;transform:none}

.hint{position:absolute;z-index:45;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,8px);display:flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--hair),0 8px 24px rgba(0,0,0,.08);font:500 14px/40px var(--f-ui);white-space:nowrap;opacity:0;transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none}
.hint.show{opacity:1;transform:translate(-50%,0)}
.hint .ico{color:var(--ink-3)}
.hint .ico[data-i=""]{display:none}

/* ---------- the gift (CSS 3D) ---------- */
.halo{position:absolute;z-index:9;width:var(--hs,300px);height:var(--hs,300px);left:var(--hx,50%);top:var(--hy,50%);margin:calc(var(--hs,300px) * -.5) 0 0 calc(var(--hs,300px) * -.5);border-radius:50%;background:radial-gradient(closest-side,rgba(255,246,222,.95),rgba(255,232,190,.45) 45%,rgba(255,232,190,0));opacity:0;pointer-events:none;mix-blend-mode:screen}
.stage3d{position:absolute;z-index:10;left:50%;top:var(--gy,55%);width:0;height:0;perspective:1000px;perspective-origin:0 -20px}
.ground3d,.shaker,.box3d,.lid3d,.wrap3d{position:absolute;left:0;top:0;transform-style:preserve-3d}
.ground3d,.box3d{transform:rotateX(-20deg) rotateY(-30deg)}
.f{position:absolute;left:0;top:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.shadow{background:radial-gradient(closest-side,rgba(50,30,12,.5),rgba(50,30,12,.18) 55%,rgba(50,30,12,0))}
.contact{background:radial-gradient(closest-side,rgba(36,22,8,.62),rgba(36,22,8,.3) 75%,rgba(36,22,8,0))}
/* white box */
.bx-front{background:linear-gradient(180deg,rgba(40,25,10,0) 30%,rgba(40,25,10,.08)),#efebe3}
.bx-right{background:linear-gradient(90deg,rgba(40,25,10,.2),rgba(40,25,10,.3)),#ece7de;box-shadow:inset 1px 0 0 rgba(255,255,255,.35)}
.in-floor{background:#cfc7ba;overflow:hidden}
.in-floor canvas{position:absolute;inset:0;width:100%;height:100%}
.in-back{background:linear-gradient(180deg,#e9e4db,#cdc5b8)}
.in-left{background:linear-gradient(90deg,#c4bbad,#d8d1c5)}
.inlight{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,226,.85),rgba(255,240,205,.35));opacity:0}
.lid-top{background:linear-gradient(180deg,#f6f3ed,#fffefb);box-shadow:inset 0 -1px 0 #fff}
.lid-front{background:linear-gradient(180deg,#f6f3ed,#e9e4db);box-shadow:inset 0 1px 0 #fff,0 3px 4px -1px rgba(60,40,20,.28)}
.lid-right{background:linear-gradient(90deg,rgba(40,25,10,.18),rgba(40,25,10,.28)),#f1ede6;box-shadow:0 3px 4px -1px rgba(60,40,20,.3)}
.bx-print{position:absolute;bottom:10%;font-size:calc(var(--A) * .034);line-height:1;color:#aaa297}
.bx-print.l{left:8%;font-family:var(--f-num);letter-spacing:.06em}
.bx-print.r{right:8%;letter-spacing:.24em}
.seal{position:absolute;left:50%;width:calc(var(--A) * .17);height:calc(var(--A) * .17);margin-left:calc(var(--A) * -.085);border-radius:50%;background:radial-gradient(circle at 34% 30%,#d2584a,#ab3127 72%);display:grid;place-items:center;color:#fff4ec;font:500 calc(var(--A) * .036)/1 var(--f-num);letter-spacing:.06em;box-shadow:0 1px 2px rgba(80,20,10,.32)}
.seal::after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(255,240,230,.6)}
/* wrapping paper */
.wr{background-color:var(--wrap);background-image:var(--tex);background-size:100% 100%}
.wr-front,.wr-half .pp{background-image:linear-gradient(180deg,rgba(40,25,10,0) 35%,rgba(40,25,10,.14)),var(--tex);background-size:100% 100%;background-color:var(--wrap)}
.wr-front{box-shadow:inset 0 1.5px 0 rgba(255,250,240,.5)}
.wr-right{background-image:linear-gradient(90deg,rgba(40,25,10,.24),rgba(40,25,10,.36)),var(--tex);background-size:100% 100%,180% 100%;box-shadow:inset 1px 0 0 rgba(255,250,240,.3)}
.wr-top{background-image:linear-gradient(180deg,rgba(255,252,244,.2),rgba(255,252,244,.34)),var(--tex);background-size:100% 100%,100% 150%;box-shadow:inset 0 -1.5px 0 rgba(255,250,240,.55)}
.wr-right svg{position:absolute;inset:0;width:100%;height:100%}
.wr-half>div{position:absolute;inset:0}
.fiber{background:#f6f1e7}
.wr-perf{pointer-events:none}
.perf{position:absolute;left:3%;right:3%;top:52%;border-top:1.5px dashed rgba(255,255,255,.8);opacity:0;transition:opacity .4s var(--ease)}
.tear-tab{position:absolute;left:calc(var(--A) * -.08);top:52%;margin-top:-14px;height:28px;width:calc(var(--A) * .2);border-radius:4px 14px 14px 4px;background:linear-gradient(180deg,#fdfaf3,#ebe3d5);box-shadow:0 1px 3px rgba(40,25,10,.32);display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-right:8px;opacity:0;transition:opacity .4s var(--ease);font:500 12px/1 var(--f-ui);color:var(--ink-2)}
.tear-tab .ico{width:14px;height:14px}
[data-stage="tear"] .perf,[data-stage="tear"] .tear-tab{opacity:1}
/* ribbon */
.rb{position:absolute}
.sat-v{background:linear-gradient(90deg,var(--ribbon-d),var(--ribbon) 30%,#fffef9 48%,var(--ribbon) 64%,var(--ribbon-d))}
.sat-h{background:linear-gradient(180deg,var(--ribbon-d),var(--ribbon) 30%,#fffef9 50%,var(--ribbon) 66%,var(--ribbon-d))}
.band-v{left:43%;width:14%;top:0;bottom:0;box-shadow:0 0 1px rgba(60,40,20,.25)}
.band-h{top:43%;height:14%;left:0;right:0;box-shadow:0 0 1px rgba(60,40,20,.25)}
.wr-right .band-v{filter:brightness(.84)}
.tail{position:absolute;transform-origin:50% 0;clip-path:polygon(0 0,100% 0,100% 100%,50% 90%,0 100%)}
.tail-a{left:calc(50% - var(--A) * .045);top:0;width:calc(var(--A) * .09);height:56%;transform:rotate(9deg)}
.tail-b{left:calc(50% - var(--A) * .04);top:0;width:calc(var(--A) * .08);height:30%;transform:rotate(-24deg)}
.tail-t{left:calc(50% - var(--A) * .045);top:50%;width:calc(var(--A) * .09);height:50%;transform-origin:50% 0;transform:rotate(14deg)}
.bow{overflow:visible;transform-origin:50% 100%;filter:drop-shadow(0 2px 2px rgba(50,30,10,.25))}
.bow svg{display:block;width:100%;height:100%;overflow:visible}
.tag-string{position:absolute;left:57%;top:14%;width:13%;height:1px;background:rgba(60,45,30,.55);transform-origin:0 50%;transform:rotate(38deg)}
.tag{position:absolute;left:67%;top:18%;width:calc(var(--A) * .44);transform:rotate(7deg);transform-origin:6% 50%;filter:drop-shadow(0 2px 2px rgba(40,25,10,.28))}
.tag-card{position:relative;padding:calc(var(--A) * .03) calc(var(--A) * .036) calc(var(--A) * .03) calc(var(--A) * .1);background:linear-gradient(170deg,#dec39c,#cdae83);clip-path:polygon(14% 0,100% 0,100% 100%,14% 100%,0 72%,0 28%)}
.tag-hole{position:absolute;left:5%;top:50%;width:calc(var(--A) * .028);height:calc(var(--A) * .028);margin-top:calc(var(--A) * -.014);border-radius:50%;background:#8b6f4c;box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.tag p{margin:0;display:flex;align-items:baseline;gap:.4em;font:400 calc(var(--A) * .05)/1.4 var(--f-hand);color:#3a2e22;min-width:0}
.tag b{flex:none;font:500 calc(var(--A) * .032)/1 var(--f-ui);color:#6e5a43}
.tag span{min-width:0;overflow-wrap:anywhere}
.riser{visibility:hidden;transform-origin:50% 100%}
.gift-hit{position:absolute;z-index:15;touch-action:none}

/* ---------- calendar ---------- */
.cal-stage{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:calc(env(safe-area-inset-top,0px) + 64px) 16px calc(env(safe-area-inset-bottom,0px) + 80px)}
.cal-top{width:var(--cw);display:flex;justify-content:space-between;align-items:baseline;transition:opacity .5s var(--ease)}
.cal-top .m{font:400 17px/24px var(--f-hand)}
.cal-top .c{font:400 13px/20px var(--f-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal-top .c b{font:400 14px/20px var(--f-num);color:var(--ink)}
.entering .cal-top,.entering .cal-ctrl,.leaving .cal-top{opacity:0}
.cal{position:relative;z-index:0;isolation:isolate;width:var(--cw);font-size:calc(var(--cw) / 22)}
.cal::after{content:"";position:absolute;z-index:-2;left:-8%;right:-8%;bottom:-1em;height:1.9em;background:radial-gradient(closest-side,rgba(55,35,15,.4),rgba(55,35,15,0))}
.pad{position:relative;width:100%;aspect-ratio:4/3}
.pad-back{position:absolute;inset:0;border-radius:2px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.06)),#d2cbbf;box-shadow:0 .15em 0 #b9b1a4,0 .5em .8em rgba(50,32,14,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;text-align:center}
.pad-back p{margin:0;font:400 1.15em/1.65 var(--f-hand);color:#544d44}
.pad-back small{font:400 .66em/1 var(--f-ui);color:#857e73}
.pad-stack{position:absolute;inset:0;border-radius:2px}
.pages{position:absolute;inset:0;touch-action:none}
.binding{position:absolute;z-index:3;left:-1%;right:-1%;top:-.15em;height:.6em;border-radius:2px;background:linear-gradient(180deg,var(--stand-l),var(--stand) 60%,var(--stand-d));box-shadow:0 1px 2px rgba(40,25,10,.3);pointer-events:none}
.stub{position:absolute;z-index:2;left:0;right:0;top:.4em;height:.42em;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .2s}
.has-stub .stub{opacity:1}
.page{position:absolute;inset:0;background:var(--paper);border-radius:2px;padding:1.25em 1.15em .75em;display:flex;flex-direction:column;box-shadow:0 0 0 .5px rgba(0,0,0,.07);transform-origin:50% 0;--lift:0}
.page::before{content:"";position:absolute;left:.6em;right:.6em;top:.82em;height:.24em;background:radial-gradient(circle at 50% 50%,rgba(31,27,22,.2) 0 .06em,transparent .08em) 0 0/.42em .24em repeat-x}
.page::after{content:"";position:absolute;inset:0;border-radius:2px;pointer-events:none;background:linear-gradient(0deg,rgba(40,25,10,.16),rgba(40,25,10,0) 55%);opacity:var(--lift)}
.pg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.6em}
.pg-date{display:flex;align-items:baseline;gap:.3em}
.pg-mon{font:500 .88em/1 var(--f-ui)}
.pg-day{font:300 2.75em/.85 var(--f-num)}
.pg-meta{text-align:right;font:400 .6em/1.65 var(--f-ui);color:var(--ink-2);padding-top:.1em}
.pg-fest{color:var(--seal);font-weight:500}
.pg-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45em}
.pg-doodle{width:3.7em;height:2.3em;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.pg-doodle .r{fill:var(--seal)}
.pg-doodle text{fill:var(--ink);stroke:none;font-family:var(--f-hand);font-size:8.5px}
.pg-q{margin:0;font:400 1.07em/1.62 var(--f-hand);text-align:center;white-space:pre-line;color:#1e1b18;text-wrap:balance}
.pg-foot{font:400 .5em/1 var(--f-num);color:#b9b2a6;text-align:right;font-variant-numeric:tabular-nums}
.page.cover{align-items:center;justify-content:center;text-align:center}
.cv-year{font:300 3.7em/1 var(--f-num);color:var(--stand-d)}
.cv-title{margin-top:.24em;font:400 1.5em/1.2 var(--f-hand);letter-spacing:.12em;padding-left:.12em}
.cv-badge{margin-top:.6em;font:500 .6em/1 var(--f-ui);letter-spacing:.2em;color:var(--seal);border:1.5px solid var(--seal);padding:.45em .4em .45em .6em;transform:rotate(-3deg);border-radius:3px}
.cv-note{margin:.96em 0 0;font:400 .74em/1.65 var(--f-hand);color:var(--ink-2)}
.stand{position:relative;z-index:1;width:90%;margin:-.45em auto 0;height:calc(var(--cw) * .17);background:linear-gradient(180deg,var(--stand-l) 0,var(--stand-l) 10%,var(--stand) 12%,var(--stand) 55%,var(--stand-d));clip-path:polygon(1.5% 0,98.5% 0,100% 100%,0 100%)}
.stand::after{content:"";position:absolute;left:0;right:0;top:10%;height:2px;background:rgba(0,0,0,.12)}
.cal-ctrl{display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .5s var(--ease)}
.ff{width:64px;height:64px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--hair),0 8px 24px rgba(0,0,0,.1);display:grid;place-items:center;color:var(--ink);transition:transform .15s var(--ease),background-color .15s var(--ease),color .15s var(--ease)}
.ff svg{width:24px;height:24px;fill:currentColor}
.ff.on{transform:scale(.97);background:var(--ink);color:var(--surface)}
.ff-label{font:400 13px/20px var(--f-ui);color:var(--ink-2)}
.ended .cal-ctrl,.last .cal-ctrl{opacity:0;pointer-events:none}

/* ---------- ticket ---------- */

function quoteFor(i){
  const d = DAYS[i], s = STOPS[key(d)];
  if (s) return s.q;
  const wd = d.getDay();
  if (wd === 1) return MONDAY[(i / 7 | 0) % MONDAY.length];
  if (wd === 0 || wd === 6) return WEEKEND[(i * 5 + (wd === 0 ? 3 : 0)) % WEEKEND.length];
  return WEEKDAY[(i * 13 + 7) % WEEKDAY.length];
}

function drag(el, h){
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    if (h.start && h.start(e) === false) return;
    e.preventDefault();
    const id = e.pointerId, x0 = e.clientX, y0 = e.clientY, t0 = performance.now();
    let last = { x:x0, y:y0, t:t0 }, vx = 0, vy = 0;
    try { el.setPointerCapture(id); } catch (_) {}
    const mv = ev => {
      if (ev.pointerId !== id) return;
      const now = performance.now(), dt = Math.max(8, now - last.t);
      vx = vx * .4 + (ev.clientX - last.x) / dt * .6; vy = vy * .4 + (ev.clientY - last.y) / dt * .6;
      last = { x:ev.clientX, y:ev.clientY, t:now };
      h.move && h.move({ dx:ev.clientX - x0, dy:ev.clientY - y0, x:ev.clientX, y:ev.clientY, vx, vy });
    };

      if (ev.pointerId !== id) return;

      const dx = ev.clientX - x0, dy = ev.clientY - y0;

    };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });

}
function mountPages(){
  pagesEl.textContent = ''; cur = makePage(idx); nxt = idx + 1 <= 364 ? makePage(idx + 1) : null;
  if (nxt) pagesEl.append(nxt); pagesEl.append(cur); updateMeta();
}
function tearTop(o = {}){
  if (idx >= 365 || !cur) return;
  const el = cur; el.style.pointerEvents = 'none';
  let ux, uy;
  if (o.dx !== undefined && (o.dx || o.dy)) { const X = o.dx + o.vx * 140, Y = o.dy + o.vy * 140, L = Math.hypot(X, Y) || 1; ux = X / L; uy = Y / L; }
  else { const a = -Math.PI / 2 + (Math.random() - .5) * 1.4; ux = Math.cos(a); uy = Math.sin(a); }
  const dist = Math.max(innerWidth, innerHeight) * .85, rot = ux * 45 + (Math.random() - .5) * 30;
  el.animate([{ transform:o.from || 'none', opacity:1 }, { transform:'translate(' + (ux * dist) + 'px,' + (uy * dist) + 'px) rotate(' + rot + 'deg)', opacity:0 }],
    { duration:o.fast ? 430 : 720, easing:'cubic-bezier(.2,.65,.35,1)', fill:'forwards' }).onfinish = () => el.remove();
  if (o.fast || o.ripped) S.flick(); else { S.rip(8, .11, .9); buzz(6); }
  if (idx === -1) stubClip();
  const step = idx >= 364 ? 1 : Math.max(1, Math.min(o.step || 1, 364 - idx));
  idx += step;
  if (step === 1) cur = nxt;
  else { if (nxt) nxt.remove(); cur = makePage(idx); pagesEl.prepend(cur); }
  nxt = idx + 1 <= 364 ? makePage(idx + 1) : null; if (nxt) pagesEl.prepend(nxt);
  updateMeta();
  const mo = idx >= 0 && idx <= 364 ? DAYS[idx].getMonth() : -1;
  if (o.fast && mo !== lastMonth) buzz(6);
  lastMonth = mo;
  if (!o.fast) {
    if (idx === 0) hint('往上撕，撕到最後有東西給你', 'up');
    else if (idx === 364) hint('最後一頁了，撕吧', 'up');
  }
  if (idx >= 365) endOfYear();
}
let freed = false;
drag(pagesEl, {
  start: () => stage === 'cal' && !ffOn && !!cur && idx < 365,
  move({ dx, dy }){
    if (!freed) {
      if (Math.hypot(dx, dy) > 34) { freed = true; S.rip(7, .09, .8); buzz(8); cur.style.setProperty('--lift', 0); }
      else {
        const l = Math.max(0, Math.min(1, -dy / 34));
        cur.style.setProperty('--lift', l.toFixed(2));
        cur.style.transform = 'perspective(900px) translate(' + dx * .15 + 'px,' + Math.min(0, dy) * .25 + 'px) rotateX(' + (l * 16).toFixed(1) + 'deg)';
        return;
      }
    }
    cur.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + dx * .07 + 'deg)';
  },
  end({ dx, dy, vx, vy, tap }){
    if (tap) tearTop({});
    else if (freed && (Math.hypot(dx, dy) > 50 || Math.hypot(vx, vy) > .45)) tearTop({ from:cur.style.transform, dx, dy, vx, vy, ripped:true });
    else { const t = cur.style.transform; cur.style.transform = ''; cur.style.setProperty('--lift', 0); if (t) cur.animate([{ transform:t }, { transform:'none' }], { duration:280, easing:EASE }); }
    freed = false;
  },
});

/* 按住快轉 */
// 按住：一路快轉到 12/31，大約 6 秒；放開就停。「直接跳到年底」：自動跑完，大約 4 秒。
let ffOn = false, ffAuto = false, ffT = 0, ffDelay = 0;
function ffStart(auto){
  if (stage !== 'cal' || ffOn || idx >= 364) return;
  S.init(); ffOn = true; ffAuto = !!auto; ffBtn.classList.add('on'); ffDelay = auto ? 150 : 220; buzz(10); hint(''); ffStep();
}
function ffStep(){
  if (!ffOn) return;
  tearTop({ fast:true, step:ffDelay <= 40 ? (ffAuto ? 4 : 3) : 1 });
  if (idx >= 364) {
    ffStop(true);
    hint('12/31 跨年，最後一頁了，撕吧', 'up');
    buzz(25); S.pluck(1318.5, 0, .07);
    return;
  }
  ffDelay = Math.max(40, ffDelay * .86); ffT = setTimeout(ffStep, ffDelay);
}
function ffStop(force){ if (!ffOn || (ffAuto && force !== true)) return; ffOn = false; ffAuto = false; clearTimeout(ffT); ffBtn.classList.remove('on'); }
$('#jumpBtn').addEventListener('click', () => ffStart(true));
ffBtn.addEventListener('pointerdown', e => { e.preventDefault(); try { ffBtn.setPointerCapture(e.pointerId); } catch (_) {} ffStart(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => ffBtn.addEventListener(t, ffStop));
ffBtn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); ffStart(); } });
ffBtn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') ffStop(); });
ffBtn.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', ffStop);

async function endOfYear(){
  setStage('busy'); ffStop(); calStage.classList.add('ended');
  hint('背面好像夾著什麼'); S.pluck(784, .1, .08);
  await wait(1800);
  showTicket(false);
}

/* ================= 9. 提貨券 ================= */
let signedName = store.get('done') ? (store.get('name') || '') : null;
function putSignature(name, animate){
  const dd = $('#holder'); dd.textContent = '';
  const s = document.createElement('span'); s.className = 'sig'; s.textContent = name || '本人'; dd.append(s);
  return animate ? anim(s, [{ clipPath:'inset(0 100% 0 0)' }, { clipPath:'inset(0 0% 0 0)' }], { duration:900, easing:'ease-out' }) : Promise.resolve();
}
async function showTicket(skip){
  hint(''); app.classList.add('evening'); setStage('busy');
  if (signedName !== null) { putSignature(signedName, false); stampEl.style.opacity = '.92'; tkStage.classList.add('done'); }
  tkStage.hidden = false; tkStage.scrollTop = 0;
  S.swish();
  if (!skip && !calStage.hidden) {
    // 提貨券從日曆背後抽出來
    tkStage.classList.add('behind'); calStage.classList.add('leaving');
    const rc = cal.getBoundingClientRect(), rt = ticket.getBoundingClientRect();
    const dy0 = (rc.top + rc.height / 2) - (rt.top + rt.height / 2), dy1 = dy0 - rc.height * .62;
    anim(cal, [{ transform:'none', opacity:1 }, { transform:'translateY(16px)', opacity:1, offset:.4 }, { transform:'translateY(42%) scale(.94)', opacity:0 }], { duration:1500, easing:EASE });
    await anim(ticket, [
      { transform:'translateY(' + dy0 + 'px) scale(.8)' },
      { transform:'translateY(' + dy1 + 'px) scale(.84) rotate(-2.5deg)', offset:.42 },
      { transform:'translateY(0) rotate(-1.2deg)' },
    ], { duration:1700, easing:EASE });
    calStage.hidden = true; tkStage.classList.remove('behind');
  } else {
    calStage.hidden = true;
    await anim(ticket, [{ transform:'translateY(105vh) rotate(8deg)' }, { transform:'translateY(0) rotate(-1.2deg)' }], { duration:800, easing:EASE });
  }
  S.pluck(1046.5, 0, .06);
  setStage('ticket');
}

const sheet = $('#sheet'), signInput = $('#signName');
$('#signBtn').addEventListener('click', () => {
  if (stage !== 'ticket') return;
  sheet.hidden = false; signInput.value = '';
  try { signInput.focus({ preventScroll:true }); } catch (e) {}
  requestAnimationFrame(() => sheet.classList.add('open'));
});
function closeSheet(){ signInput.blur(); sheet.classList.remove('open'); setTimeout(() => { sheet.hidden = true; }, 340); }
$('#signForm').addEventListener('submit', e => { e.preventDefault(); const v = signInput.value.trim().slice(0, 12); closeSheet(); sign(v); });
$('#signSkip').addEventListener('click', () => { closeSheet(); sign(''); });
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

async function sign(name){
  setStage('busy'); buzz(6); await wait(250);
  S.scribble();
  await putSignature(name, true);
  signedName = name; store.set('name', name);
  // 簽完名，印章先淡淡地浮在上面，等對方自己按下去
  await anim(stampEl, [{ transform:'scale(1.3) rotate(-14deg)', opacity:0 }, { transform:'scale(1.12) rotate(-9deg)', opacity:.18 }], { duration:400, easing:EASE });
  setStage('stamp'); hint('按一下，蓋章', 'tap');
}
async function stampIt(){
  setStage('busy'); hint('');
  await anim(stampEl, [{ transform:'scale(1.12) rotate(-9deg)', opacity:.18 }, { transform:'scale(1.5) rotate(-15deg)', opacity:.1, offset:.35 }, { transform:'scale(1) rotate(-9deg)', opacity:.92 }], { duration:260, easing:'cubic-bezier(.55,0,.9,.45)' });
  S.stamp();
  ticket.animate([{ transform:'translateY(0) rotate(-1.2deg)' }, { transform:'translateY(4px) rotate(-1.45deg)' }, { transform:'translateY(0) rotate(-1.2deg)' }], { duration:200 });
  store.set('done', '1');
  await wait(650);
  tkStage.classList.add('done'); S.bgmSwell(); setStage('ticket-done');
}
ticket.addEventListener('click', () => { if (stage !== 'stamp') return; buzz([30, 60, 30, 60, 30]); stampIt(); });

$('#againBtn').addEventListener('click', () => {
  tkStage.hidden = true; app.classList.remove('evening');
  ticket.getAnimations().forEach(a => a.cancel()); cal.getAnimations().forEach(a => a.cancel());
  idx = -1; mountPages();
  calStage.hidden = false; calStage.classList.remove('ended', 'entering', 'leaving');
  cal.animate([{ opacity:0, transform:'translateY(12px)' }, { opacity:1, transform:'none' }], { duration:400, easing:EASE });
  setStage('cal'); hint('往上撕掉封面', 'up');
});
$('#restartBtn').addEventListener('click', () => location.reload());

/* ================= 10. 撒花 ================= */
function confetti(cx, cy, w){
  const n = RM ? 6 : 18, nums = [1, 4, 6, 14, 25, 31, 8, 15, 11, 9];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'cf'; p.textContent = nums[i % nums.length];
    p.style.left = (cx + (Math.random() - .5) * w * .6) + 'px'; p.style.top = cy + 'px'; fx.append(p);
    const dx = (Math.random() - .5) * innerWidth * .9, up = innerHeight * (.22 + Math.random() * .25), r = (Math.random() - .5) * 900;
    p.animate([
      { transform:'translate(0,0) rotate(0deg) scale(.5)', opacity:0 },
      { transform:'translate(' + dx * .45 + 'px,' + (-up) + 'px) rotate(' + r * .35 + 'deg) scale(1)', opacity:1, offset:.3 },
      { transform:'translate(' + dx + 'px,' + (innerHeight * .45) + 'px) rotate(' + r + 'deg) scale(1)', opacity:0 },
    ], { duration:2400 + Math.random() * 1000, delay:Math.random() * 180, easing:'cubic-bezier(.15,.55,.35,1)', fill:'forwards' }).onfinish = () => p.remove();
  }
}
function bits(x0, y, w){
  const n = RM ? 4 : 12;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'bit';
    p.style.left = (x0 + Math.random() * w) + 'px'; p.style.top = y + 'px'; fx.append(p);
    const dx = (Math.random() - .5) * 160, dy = (Math.random() - .3) * 220, r = (Math.random() - .5) * 720;
    p.animate([{ transform:'none', opacity:1 }, { transform:'translate(' + dx + 'px,' + dy + 'px) rotate(' + r + 'deg)', opacity:0 }],
      { duration:800 + Math.random() * 500, easing:'cubic-bezier(.2,.6,.4,1)', fill:'forwards' }).onfinish = () => p.remove();
  }
}

mountPages();
})();
</script>
